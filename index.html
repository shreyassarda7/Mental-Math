<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Math Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>

<body class="h-full flex items-center justify-center text-white select-none">

    <!-- Main Container -->
    <div class="w-full max-w-md p-4">

        <!-- MENU SCREEN -->
        <div id="start-screen"
            class="bg-slate-800 rounded-2xl shadow-2xl p-6 text-center border border-slate-700 transition-all duration-300">

            <!-- Auth Header -->
            <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <div id="user-display" class="text-sm font-medium text-slate-400">Guest</div>
                <button id="auth-btn"
                    class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-cyan-400 font-bold transition-colors">
                    Login
                </button>
            </div>

            <h1
                class="text-3xl font-extrabold mb-2 bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                Mental Math
            </h1>
            <p class="text-slate-400 mb-6 font-medium text-sm">Select Training Mode</p>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <button id="btn-std"
                    class="p-4 bg-slate-700 hover:bg-cyan-900/40 border border-slate-600 hover:border-cyan-500 rounded-xl transition-all group">
                    <div class="text-2xl mb-1">🎮</div>
                    <div class="font-bold text-slate-200 group-hover:text-cyan-400">Standard</div>
                    <div class="text-xs text-slate-500">20 Qs</div>
                </button>

                <div class="grid grid-rows-2 gap-2">
                    <button id="btn-trader-20"
                        class="p-2 bg-slate-700 hover:bg-amber-900/40 border border-slate-600 hover:border-amber-500 rounded-xl transition-all group flex items-center justify-center gap-2">
                        <span class="text-xl">📈</span>
                        <div class="text-left">
                            <div class="font-bold text-slate-200 text-sm group-hover:text-amber-400">Trader 20</div>
                        </div>
                    </button>
                    <button id="btn-trader-40"
                        class="p-2 bg-slate-700 hover:bg-amber-900/40 border border-slate-600 hover:border-amber-500 rounded-xl transition-all group flex items-center justify-center gap-2">
                        <span class="text-xl">📈</span>
                        <div class="text-left">
                            <div class="font-bold text-slate-200 text-sm group-hover:text-amber-400">Trader 40</div>
                        </div>
                    </button>
                </div>

                <button id="btn-memory"
                    class="p-4 bg-slate-700 hover:bg-purple-900/40 border border-slate-600 hover:border-purple-500 rounded-xl transition-all group">
                    <div class="text-2xl mb-1">🧠</div>
                    <div class="font-bold text-slate-200 group-hover:text-purple-400">Memory</div>
                    <div class="text-xs text-slate-500">Chain Ops</div>
                </button>

                <button id="btn-dash"
                    class="p-4 bg-slate-700 hover:bg-emerald-900/40 border border-slate-600 hover:border-emerald-500 rounded-xl transition-all group">
                    <div class="text-2xl mb-1">📊</div>
                    <div class="font-bold text-slate-200 group-hover:text-emerald-400">Stats</div>
                    <div class="text-xs text-slate-500">Dashboard</div>
                </button>
            </div>
        </div>

        <!-- DASHBOARD SCREEN -->
        <div id="dashboard-screen"
            class="hidden bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 h-[500px] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">Performance</h2>
                <button id="dash-back" class="text-slate-400 hover:text-white">✕</button>
            </div>

            <!-- KPIs -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                    <div class="text-xs text-slate-500 uppercase">Games Played</div>
                    <div id="stat-games" class="text-2xl font-bold text-white">-</div>
                </div>
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                    <div class="text-xs text-slate-500 uppercase">High Score</div>
                    <div id="stat-high" class="text-2xl font-bold text-emerald-400">-</div>
                </div>
            </div>

            <!-- Recent History -->
            <h3 class="text-sm font-bold text-slate-400 mb-2 uppercase">Recent Sessions</h3>
            <div class="overflow-hidden rounded-xl border border-slate-700">
                <table class="w-full text-sm text-left text-slate-400">
                    <thead class="text-xs text-slate-200 uppercase bg-slate-700">
                        <tr>
                            <th class="px-3 py-2">Mode</th>
                            <th class="px-3 py-2 text-right">Score</th>
                            <th class="px-3 py-2 text-right">Date</th>
                        </tr>
                    </thead>
                    <tbody id="dash-history" class="divide-y divide-slate-700">
                        <!-- Injected -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="hidden relative">
            <!-- Top Bar: Progress & Score -->
            <div class="flex justify-between items-center mb-4 text-sm font-semibold text-slate-400">
                <div>Q <span id="qnum" class="text-white">1</span>/20</div>
                <div>Score: <span id="score" class="text-cyan-400">0</span></div>
            </div>

            <!-- Progress Bar -->
            <div class="h-2 bg-slate-700 rounded-full mb-6 overflow-hidden">
                <div id="progress-bar"
                    class="h-full bg-gradient-to-r from-cyan-500 to-blue-500 w-0 transition-all duration-300"></div>
            </div>

            <!-- Main Card -->
            <div id="quiz-card"
                class="bg-slate-800 rounded-2xl shadow-2xl p-8 text-center border border-slate-700 relative overflow-hidden">

                <!-- Timer Visual (Top Border of card) -->
                <div id="timer-bar"
                    class="absolute top-0 left-0 h-1 bg-yellow-400 w-full transition-all duration-100 ease-linear">
                </div>

                <div class="mb-8 mt-4">
                    <h2 id="question" class="text-5xl font-extrabold text-white tracking-tight"></h2>
                </div>

                <div class="space-y-4">
                    <!-- Standard Input -->
                    <input id="answer" type="text" autocomplete="off"
                        class="w-full bg-slate-900 border-2 border-slate-700 rounded-xl p-4 text-center text-3xl font-bold focus:border-cyan-500 outline-none transition-colors placeholder-slate-700 text-white"
                        placeholder="?" autofocus>

                    <!-- Division Inputs (Hidden by default) -->
                    <div id="div-inputs" class="hidden flex gap-2">
                        <input id="ans-q" type="tel"
                            class="w-1/2 bg-slate-900 border-2 border-slate-700 rounded-xl p-4 text-center text-3xl font-bold focus:border-cyan-500 outline-none transition-colors text-white"
                            placeholder="Q">
                        <input id="ans-r" type="tel"
                            class="w-1/2 bg-slate-900 border-2 border-slate-700 rounded-xl p-4 text-center text-3xl font-bold focus:border-cyan-500 outline-none transition-colors text-white"
                            placeholder="R">
                    </div>

                    <button id="submit"
                        class="w-full py-4 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 rounded-xl font-bold text-lg transition-transform active:scale-95 shadow-lg shadow-blue-900/30">
                        Submit
                    </button>
                </div>

                <!-- Timer Text -->
                <div class="mt-4 text-lg font-mono font-bold text-slate-400">
                    <span id="time" class="text-2xl text-white">10</span>s
                </div>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen"
            class="hidden bg-slate-800 rounded-2xl shadow-2xl p-8 text-center border border-slate-700 max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-bold text-slate-300 mb-2">Session Complete</h2>
            <div
                class="text-6xl font-black mb-6 bg-gradient-to-r from-green-400 to-emerald-600 bg-clip-text text-transparent">
                <span id="final"></span><span class="text-2xl text-slate-500 ml-1">/ 20</span>
            </div>

            <!-- Session Summary Table -->
            <div class="mb-6 overflow-hidden rounded-xl border border-slate-700">
                <table class="w-full text-sm text-left text-slate-400">
                    <thead class="text-xs text-slate-200 uppercase bg-slate-700">
                        <tr>
                            <th scope="col" class="px-4 py-3">Q</th>
                            <th scope="col" class="px-4 py-3">Ans</th>
                            <th scope="col" class="px-4 py-3">Real</th>
                            <th scope="col" class="px-4 py-3 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="summary-body" class="divide-y divide-slate-700">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>

            <button id="restart"
                class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 rounded-xl font-bold text-lg transition-transform active:scale-95 shadow-lg shadow-emerald-900/30">
                New Session
            </button>
        </div>

    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
